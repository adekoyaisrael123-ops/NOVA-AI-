<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nova AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="app">

        <!-- ==========================================
             SIDEBAR
        =========================================== -->

        <aside class="sidebar">

            <div class="logo">
                <div class="logo-icon">✦</div>

                <div>
                    <h2>Nova AI</h2>
                    <span>AI Assistant</span>
                </div>
            </div>

            <button
                id="newChatBtn"
                class="new-chat-btn"
            >
                <span>＋</span>
                New Chat
            </button>

            <!-- Search -->

            <div class="search-box">

                <span>🔍</span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search chats..."
                >

            </div>

            <!-- Recent -->

            <div class="recent-header">

                <span>Recent Chats</span>

                <span id="chatCount">0</span>

            </div>

            <div
                id="chatList"
                class="chat-list"
            >
            </div>

            <div class="sidebar-bottom">

                <button
                    id="logoutBtn"
                    class="logout-btn"
                >
                    🚪 Logout
                </button>

            </div>

        </aside>


        <!-- ==========================================
             MAIN AREA
        =========================================== -->

        <main class="main">

            <!-- Topbar -->

            <header class="topbar">

                <div class="mobile-menu">
                    ☰
                </div>

                <div class="topbar-title">

                    <div class="status-dot"></div>

                    <div>
                        <h3 id="chatTitle">
                            Nova AI
                        </h3>

                        <span id="userEmailLabel">
                            Online
                        </span>
                    </div>

                </div>

                <div class="topbar-actions">

                    <button
                        id="clearChatBtn"
                        title="Clear chat"
                    >
                        🧹
                    </button>

                </div>

            </header>


            <!-- ======================================
                 CHAT AREA
            ======================================= -->

            <section
                id="chatMessages"
                class="chat-messages"
            >

                <div
                    id="welcomeScreen"
                    class="welcome-screen"
                >

                    <div class="welcome-icon">
                        ✦
                    </div>

                    <h1>
                        How can I help you?
                    </h1>

                    <p>
                        Ask Nova AI anything.
                    </p>

                    <div class="suggestions">

                        <button class="suggestion">
                            Explain JavaScript to me
                        </button>

                        <button class="suggestion">
                            Help me build a website
                        </button>

                        <button class="suggestion">
                            Write a Python program
                        </button>

                        <button class="suggestion">
                            Give me business ideas
                        </button>

                    </div>

                </div>

            </section>


            <!-- ======================================
                 TYPING INDICATOR
            ======================================= -->

            <div
                id="typingIndicator"
                class="typing-indicator hidden"
            >

                <div class="typing-avatar">
                    ✦
                </div>

                <div class="typing-bubble">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

                <span class="typing-text">
                    Nova AI is typing...
                </span>

            </div>


            <!-- ======================================
                 MESSAGE INPUT
            ======================================= -->

            <footer class="composer-area">

                <form id="messageForm">

                    <div class="composer">

                        <textarea
                            id="messageInput"
                            rows="1"
                            placeholder="Message Nova AI..."
                            autocomplete="off"
                        ></textarea>

                        <button
                            type="submit"
                            id="sendBtn"
                            title="Send message"
                        >
                            ➤
                        </button>

                    </div>

                    <div class="composer-info">

                        <span>
                            Enter to send • Shift + Enter for new line
                        </span>

                        <span id="charCount">
                            0 / 4000
                        </span>

                    </div>

                </form>

            </footer>

        </main>

    </div>


    <!-- ==========================================
         LOGIN MODAL
    =========================================== -->

    <div
        id="loginModal"
        class="modal hidden"
    >

        <div class="modal-card">

            <div class="modal-logo">
                ✦
            </div>

            <h2>Welcome to Nova AI</h2>

            <p>
                Sign in to continue chatting.
            </p>

            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email address"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit" id="authSubmitBtn">
                    Create Account
                </button>

                <button type="button" id="toggleAuthModeBtn" class="secondary-btn">
                    Already have an account? Login
                </button>

                <button type="button" id="forgotPasswordBtn" class="text-btn">
                    Forgot password?
                </button>

            </form>

            <form id="resetPasswordForm" class="reset-form hidden">

                <h3>Reset Password</h3>

                <input
                    type="email"
                    id="resetEmail"
                    placeholder="Email address"
                    required
                >

                <input
                    type="password"
                    id="resetPassword"
                    placeholder="New password"
                    required
                >

                <div class="reset-actions">
                    <button type="submit" class="primary-reset-btn">
                        Update Password
                    </button>

                    <button type="button" id="cancelResetBtn" class="secondary-btn">
                        Cancel
                    </button>
                </div>

            </form>

            <p class="auth-note">
                Your account is saved in this browser.
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
